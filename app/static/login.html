<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Welfog AI Voice Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #080C14;
      --bg-card: rgba(17, 24, 39, 0.75);
      --bg-card-border: rgba(255, 255, 255, 0.08);
      --accent-teal: #10B981;
      --accent-cyan: #06B6D4;
      --accent-violet: #8B5CF6;
      --text-main: #F9FAFB;
      --text-muted: #9CA3AF;
      --font-display: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.12) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(139, 92, 246, 0.06) 0px, transparent 60%);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* Ambient animated blobs */
    .ambient-blob {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      opacity: 0.4;
      animation: float 12s infinite alternate ease-in-out;
    }

    .blob-1 {
      top: -100px;
      left: -100px;
      background: linear-gradient(135deg, var(--accent-teal), #047857);
    }

    .blob-2 {
      bottom: -100px;
      right: -100px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-violet));
      animation-delay: -6s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(60px, 40px) scale(1.1); }
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 10;
    }

    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--bg-card-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 40px 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-teal), var(--accent-cyan), var(--accent-violet));
    }

    .brand-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-icon-box {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(6, 182, 212, 0.2));
      border: 1px solid rgba(16, 185, 129, 0.3);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.2);
    }

    .brand-icon-box svg {
      width: 28px;
      height: 28px;
      fill: var(--accent-teal);
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 40%, var(--text-muted) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .badge-admin {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 9999px;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.3);
      color: #C4B5FD;
      font-size: 11px;
      font-weight: 600;
      margin-top: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #D1D5DB;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--bg-card-border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 14px;
      color: #ffffff;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.2);
      background: rgba(255, 255, 255, 0.06);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--accent-teal), #059669);
      color: #ffffff;
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 26px;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.35);
    }

    .btn-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(16, 185, 129, 0.5);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .error-alert {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #FCA5A5;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .footer-note {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .footer-note strong {
      color: #D1D5DB;
    }
  </style>
</head>
<body>

  <div class="ambient-blob blob-1"></div>
  <div class="ambient-blob blob-2"></div>

  <div class="login-container">
    <div class="login-card">
      <div class="brand-header">
        <div class="brand-icon-box">
          <svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2a1 1 0 011.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.24 1.02l-2.21 2.2z"/></svg>
        </div>
        <h1 class="brand-title">Welfog AI Voice Agent</h1>
        <p class="brand-subtitle">Autonomous Customer Calling &amp; Confirmation Platform</p>
        <div class="badge-admin">🔒 Administrator Portal</div>
      </div>

      <div id="errorAlert" class="error-alert"></div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username">Admin Username</label>
          <div class="input-wrapper">
            <input type="text" id="username" value="admin" required placeholder="Enter admin username" autofocus />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" value="admin@123" required placeholder="Enter password" />
          </div>
        </div>

        <button type="submit" id="btnSubmit" class="btn-submit">
          <span>Sign In to Dashboard</span>
          <span>→</span>
        </button>
      </form>

      <div class="footer-note">
        Authorized Access Only &bull; <strong>Welfog Internet Pvt Ltd</strong>
      </div>
    </div>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const errorAlert = document.getElementById('errorAlert');
      const btnSubmit = document.getElementById('btnSubmit');

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      errorAlert.style.display = 'none';
      btnSubmit.disabled = true;
      btnSubmit.innerHTML = '<span>Verifying credentials...</span>';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (res.ok && data.success) {
          btnSubmit.innerHTML = '<span>Login Successful! Redirecting...</span>';
          btnSubmit.style.background = 'linear-gradient(135deg, #10B981, #047857)';
          setTimeout(() => {
            window.location.href = '/dashboard';
          }, 400);
        } else {
          errorAlert.textContent = data.detail || 'Invalid username or password. Please try again.';
          errorAlert.style.display = 'block';
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = '<span>Sign In to Dashboard</span> <span>→</span>';
        }
      } catch (err) {
        errorAlert.textContent = 'Network error connecting to auth server: ' + err.message;
        errorAlert.style.display = 'block';
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '<span>Sign In to Dashboard</span> <span>→</span>';
      }
    }
  </script>
</body>
</html>
